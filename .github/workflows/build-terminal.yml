# Build Windows Terminal (microsoft/terminal) on GitHub Actions
#
# Produces ONE artifact:
#   - WindowsTerminal-x64-portable.zip : portable zip of the unpacked package
#     layout (what microsoft's own Canary "Portable ZIP" distribution is:
#     AppxManifest.xml + resources.pri + XAML resources + exes/dlls — this is
#     what makes WindowsTerminal.exe run WITHOUT being installed).
#     The loose bin\x64\Release output does NOT work unpackaged: it fast-fails
#     0xC0000409 because it lacks resources.pri / XAML resources.
#
# Why the FULL solution is built (not just the .wapproj):
#   Several generated headers (winrt/Microsoft.Terminal.Settings.Model.h,
#   ITerminalHandoff.h, ...) are produced by other projects and sequenced by
#   solution-level build order. Building the .wapproj graph alone compiles
#   consumers before generators -> C1083 failures. The wapproj is part of
#   OpenConsole.slnx, so GenerateAppxPackageOnBuild=true on the solution build
#   runs the packaging with correct ordering (SolutionDir is also auto-defined).
#   The resulting .msix is NOT published — only the zip is.
#
# Efficiency: Release configuration, x64 only, /p:DebugSymbols=false +
# /p:DebugType=none (no PDB generation).
#
# Requirements (README + .vsconfig): VS 2026 18.6+, Win11 SDK 10.0.26100.8249+,
# Desktop C++ + WinUI workloads. windows-latest (VS 2026 since June 2026) covers these.

name: Build Windows Terminal

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / commit SHA to build. Default pins to a 1.25 release-branch commit.'
        required: false
        default: 'f88b209f1e57e1d8ca35977260c3cddacccaeb31'
  push:
    branches: [main]

# needed to create a release via the GitHub API
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versioning targets inspect git history/tags
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      # The NuGet.Config points at the public Azure DevOps feed
      # https://pkgs.dev.azure.com/shine-oss/terminal/_packaging/TerminalDependencies@Local
      # which is anonymously readable, so plain restore works.
      - name: NuGet restore
        run: |
          nuget restore OpenConsole.slnx
          nuget restore dep\nuget\packages.config

      - name: Build solution (Release, x64, NO appx generation, PDBs ON)
        shell: pwsh
        run: |
          Import-Module .\tools\OpenConsole.psm1
          # arch is auto-detected from PROCESSOR_ARCHITECTURE (x64 on this runner)
          Set-MsbuildDevEnvironment
          # Step 1 of 2: full solution compile with GenerateAppxPackageOnBuild=false.
          # This is the known-good build (your first run succeeded this way).
          # Keeping appx generation OFF here is what avoids APPX0703 on the test
          # host apps (TestHostApp's _ValidateAppxPackage only runs when appx
          # generation is enabled, and it references taef.png from the TAEF
          # framework that isn't installed on the runner).
          # Solution-level code-gen ordering is preserved, so generated headers
          # (winrt/Microsoft.Terminal.Settings.Model.h, ITerminalHandoff.h, ...)
          # exist before consumers compile.
          # WindowsTerminalBranding=Canary matches microsoft's own "Portable ZIP"
          # distribution (Canary build, Package-Can.appxmanifest, Canary AUMID).
          # PDBs are ENABLED (we are debugging an abort-on-startup crash, and the
          # dumps are unresolvable without symbols). Small link-time cost only.
          Invoke-OpenConsoleBuild /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:WindowsTerminalBranding=Canary `
            /p:GenerateAppxPackageOnBuild=false

      - name: Package layout (wapproj only, appx on, no project rebuild)
        shell: pwsh
        run: |
          Import-Module .\tools\OpenConsole.psm1
          Set-MsbuildDevEnvironment
          # Step 2 of 2: build ONLY CascadiaPackage.wapproj to run the packaging
          # targets and produce the unpacked layout (resources.pri + XAML
          # resources) that makes WindowsTerminal.exe run unpackaged.
          #
          # /p:BuildProjectReferences=false  -> do NOT rebuild referenced
          #   projects; reuse the binaries from step 1. This is the key: no
          #   recompile means no C1083 (generated-header ordering only matters
          #   during compilation), and the wapproj doesn't pull in test projects
          #   so no APPX0703. It only runs MakePri + MakeAppx staging.
          # /p:SolutionDir  -> required when building a bare project (msbuild
          #   only auto-defines it for solution builds); with trailing backslash.
          # The package project auto-disables signing because
          # CascadiaPackage_TemporaryKey.pfx does not exist in the repo.
          msbuild.exe src\cascadia\CascadiaPackage\CascadiaPackage.wapproj /t:Build `
            /m "/p:SolutionDir=$PWD\" `
            /p:BuildProjectReferences=false `
            /p:Configuration=Release /p:Platform=x64 `
            /p:WindowsTerminalBranding=Canary `
            /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            "/p:AppxPackageDir=$PWD\msix\"

      - name: Collect portable zip
        shell: pwsh
        run: |
          # The unpacked package layout: a directory containing BOTH
          # AppxManifest.xml and WindowsTerminal.exe (+ resources.pri ...).
          # GenerateAppxPackageOnBuild puts it under msix\; fall back to a
          # repo-wide search just in case.
          $candidates = @()
          foreach ($root in @("$PWD\msix", $PWD)) {
            $candidates += Get-ChildItem -Recurse -Directory $root -ErrorAction SilentlyContinue |
              Where-Object { (Test-Path (Join-Path $_.FullName 'AppxManifest.xml')) -and
                             (Test-Path (Join-Path $_.FullName 'WindowsTerminal.exe')) }
            if ($candidates) { break }
          }
          $layoutDir = $candidates | Select-Object -First 1
          if (-not $layoutDir) {
            Get-ChildItem -Recurse -Filter AppxManifest.xml -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "No package layout dir found (see AppxManifest.xml locations above)"
          }
          Write-Host "Layout: $($layoutDir.FullName)"

          # MERGE the WindowsTerminal project output into the layout dir.
          # Step 2 built the wapproj with /p:BuildProjectReferences=false, which
          # avoids recompiling (no C1083) but also makes the wapproj's staging
          # skip NuGet-provided content — most importantly Microsoft.UI.Xaml.dll
          # (from the Microsoft.UI.Xaml.2.8.4 package), which the WindowsTerminal
          # project copies into ITS output during step 1. Without it the app
          # loads the OS XAML host but fast-fails (0xc0000409) when it can't
          # initialize the WinUI control. Copying the whole WindowsTerminal
          # output dir on top of the layout guarantees completeness.
          $wtOut = "$PWD\bin\x64\Release\WindowsTerminal"
          if (-not (Test-Path $wtOut)) { throw "WindowsTerminal output not found: $wtOut" }
          Write-Host "Merging $wtOut into layout"
          Copy-Item -Path "$wtOut\*" -Destination $layoutDir.FullName -Recurse -Force

          # Sanity check: refuse to ship a layout missing the DLL we just fixed.
          if (-not (Test-Path (Join-Path $layoutDir.FullName 'Microsoft.UI.Xaml.dll'))) {
            throw "Microsoft.UI.Xaml.dll still missing after merge — aborting"
          }

          Compress-Archive -Path (Join-Path $layoutDir.FullName '*') `
            -DestinationPath WindowsTerminal-x64-portable.zip
          Get-Item WindowsTerminal-x64-portable.zip | Format-Table Name, Length

      - name: Collect PDBs (for crash-dump symbol resolution)
        shell: pwsh
        run: |
          # Gather the PDBs needed to resolve the abort-on-startup crash dumps.
          # WindowsTerminal.pdb (host exe, where the throw lives) + the app DLLs
          # that load early. Compressed as a separate artifact, NOT in the zip
          # users run.
          $pdbRoot = "$PWD\bin\x64\Release"
          $pdbs = @(
            'WindowsTerminal\WindowsTerminal.pdb',
            'WindowsTerminal\TerminalApp.pdb',
            'WindowsTerminal\Microsoft.Terminal.Control.pdb',
            'WindowsTerminal\TerminalThemeHelpers.pdb',
            'WindowsTerminal\TerminalSettingsModel.pdb',
            'WindowsTerminal\TerminalConnection.pdb'
          ) | ForEach-Object { Join-Path $pdbRoot $_ } | Where-Object { Test-Path $_ }
          if (-not $pdbs) { throw "No PDBs found under $pdbRoot" }
          Compress-Archive -Path $pdbs -DestinationPath WindowsTerminal-x64-symbols.zip
          Get-Item WindowsTerminal-x64-symbols.zip | Format-Table Name, Length

      # Release downloads come from GitHub's CDN (objects.githubusercontent.com)
      # and are much faster than workflow-artifact downloads.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Windows Terminal ${{ inputs.ref || github.sha }} (build ${{ github.run_number }})
          files: |
            WindowsTerminal-x64-portable.zip
            WindowsTerminal-x64-symbols.zip
          body: |
            Portable build of microsoft/terminal — Release, x64 only, Canary branding.
            Commit: ${{ github.sha }}

            **Usage:**
            * Extract anywhere and run `WindowsTerminal.exe` from the extracted folder.
            * No install, no Developer Mode, no admin rights needed.

            `WindowsTerminal-x64-symbols.zip` is the matching PDB set — keep it only
            if you need to decode a crash dump; it is not needed to run the app.

      # kept as a fallback for debugging; delete this step if you don't need it
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-x64-portable
          path: |
            WindowsTerminal-x64-portable.zip
            WindowsTerminal-x64-symbols.zip
